on:
  push:
    branches:
    - main

jobs:
  run_pull_merge:
    name: run pull
    runs-on: ubuntu-latest


    steps: 
    - name: install ssh keys 
      run: |
        install -m 600 -D /dev/null ~/.ssh/id_rsa
        echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
        touch ~/.ssh/known_hosts
        ssh-keyscan -H ${{secrets.SSH_HOST}} > ~/.ssh/known_hosts
        
    - name: connect and pull
      run: ssh -vv -p ${{secrets.SSH_PORT}} ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} "cd ${{secrets.REPO_DIR}} && git checkout ${{secrets.MAIN_BRANCH}} && git pull && npm i && npm run build && pm2 restart all"
    - name: cleanup
      run: rm -rf ~/.ssh
      
