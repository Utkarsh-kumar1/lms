on:
  push:
    branches:
    - main

jobs:
  run_pull_merge:
    name: run pull
    runs-on: ubuntu-latest


    steps: 
    - name: install ssh keys
      run: |
        install -m 600 -D /dev/null ~/.ssh/id_rsa
        echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
        ssh-keyscan -H ${{secrets.SSH_HOST}} > ~/.ssh/known_hosts
    - name: connect and pull
      run: ssh ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} "cd ${{REPO_DIR}} && git checkout ${{MAIN_BRANCH}} && git pull && npm i && npm run build && pm2 restart all"
    - name: cleanup
      run: rm -rf ~/.ssh
      
